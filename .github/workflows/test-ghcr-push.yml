name: Test GHCR Push

on:
  workflow_dispatch:

jobs:
  test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug Info
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository Owner: ${{ github.repository_owner }}"
          echo "Actor: ${{ github.actor }}"
          
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push test image
        run: |
          echo "FROM alpine:latest" > Dockerfile.test
          echo "RUN echo 'test'" >> Dockerfile.test
          
          # Try with full repository path
          docker build -f Dockerfile.test -t ghcr.io/${{ github.repository_owner }}/coolify:test .
          docker push ghcr.io/${{ github.repository_owner }}/coolify:test
          
          # Also try with lowercase
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag ghcr.io/${{ github.repository_owner }}/coolify:test ghcr.io/${REPO_OWNER_LOWER}/coolify:test-lower
          docker push ghcr.io/${REPO_OWNER_LOWER}/coolify:test-lower