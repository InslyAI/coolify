name: Staging Build

on:
  push:
    branches-ignore:
      - v4.x
      - v3.x
      - '**v5.x**'
    paths-ignore:
        - .github/workflows/coolify-helper.yml
        - .github/workflows/coolify-helper-next.yml
        - .github/workflows/coolify-realtime.yml
        - .github/workflows/coolify-realtime-next.yml
        - docker/coolify-helper/Dockerfile
        - docker/coolify-realtime/Dockerfile
        - docker/testing-host/Dockerfile
        - templates/**
        - CHANGELOG.md

env:
  GITHUB_REGISTRY: ghcr.io
  IMAGE_NAME: "coolify"
  FULL_IMAGE_NAME: "kivilaid/coolify"

jobs:
  amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN  }}


      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.FULL_IMAGE_NAME }}:${{ github.ref_name }}

  aarch64:
    runs-on: [self-hosted, arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Sanitize branch name for Docker tag
        id: sanitize
        run: |
          # Replace slashes and other invalid characters with dashes
          SANITIZED_NAME=$(echo "${{ github.ref_name }}" | sed 's/[\/]/-/g')
          echo "tag=${SANITIZED_NAME}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN  }}


      - name: Build and Push Image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.FULL_IMAGE_NAME }}:${{ github.ref_name }}-aarch64

  merge-manifest:
    runs-on: ubuntu-24.04
    needs: build-push
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Sanitize branch name for Docker tag
        id: sanitize
        run: |
          # Replace slashes and other invalid characters with dashes
          SANITIZED_NAME=$(echo "${{ github.ref_name }}" | sed 's/[\/]/-/g')
          echo "tag=${SANITIZED_NAME}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.GITHUB_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN  }}


      - name: Create & publish manifest on ${{ env.GITHUB_REGISTRY }}
        run: |
         docker buildx imagetools create \
         --append ${{ env.GITHUB_REGISTRY }}/${{ env.FULL_IMAGE_NAME }}:${{ github.ref_name }}-aarch64 \
         --tag ${{ env.GITHUB_REGISTRY }}/${{ env.FULL_IMAGE_NAME }}:${{ github.ref_name }}


      - uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_DEV_RELEASE_CHANNEL  }}
